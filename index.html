<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arthur Cheer Performance V5</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><header><div><p class="eyebrow">ARTHUR CHEER PERFORMANCE • V5</p><h1>Cheer Performance</h1></div><span id="phaseBadge" class="badge"></span></header>
<section class="panel"><div class="head"><div><p class="eyebrow">AGENDA DA SEMANA</p><h2 id="range"></h2></div><div><button id="prev">‹</button><button id="next">›</button></div></div><p class="muted">Arraste no PC. No celular: toque no treino e depois no dia de destino.</p><div id="calendar" class="calendar"></div></section>
<section class="panel hero"><div><p id="date" class="eyebrow"></p><h2 id="todayTitle"></h2><p id="todayMeta" class="muted"></p></div><div id="ring" class="ring"><b id="pct">0%</b></div></section>
<section class="panel"><div class="head"><div><p class="eyebrow">TREINO DE HOJE</p><h2 id="sessionTitle"></h2></div><button id="clear">Limpar</button></div><div id="cue"></div><div id="workout"></div></section>
<section class="panel"><p class="eyebrow">PROGRAMA</p><h2>Semana e fase</h2><div class="grid"><label>Semana atual<input id="weekInput" type="number" min="1" max="16"></label><label>Fase<input id="phaseInput" disabled></label></div><p id="focus" class="muted"></p><button id="saveWeek" class="primary">Atualizar programa</button></section>
<section class="panel"><div class="head"><div><p class="eyebrow">CHEER TRANSFER</p><h2>Toss Quality Score</h2></div><b id="score">0/25</b></div><div class="grid scores"><label>Altura<input id="height" type="number" min="1" max="5"></label><label>Verticalidade<input id="vertical" type="number" min="1" max="5"></label><label>Timing pernas/braços<input id="timing" type="number" min="1" max="5"></label><label>Tripla extensão<input id="extension" type="number" min="1" max="5"></label><label>Catch/controle<input id="control" type="number" min="1" max="5"></label></div><button id="saveScore" class="primary">Salvar Toss Score</button></section>
</div><script src="app.js"></script></body></html>
